services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegiscall
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/mock_insurance_api/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegiscall"]
      interval: 5s
      timeout: 3s
      retries: 10

  workflow-api:
    build: ./backend/mock_insurance_api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/aegiscall
      TOKEN_SECRET: ${TOKEN_SECRET:-}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
