[project]
name = "mock-insurance-api"
version = "0.1.0"
description = "AegisCall mock insurance workflow API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
 "httpx2>=2.13.1",
 "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "seed"]
